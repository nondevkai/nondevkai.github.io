ne round per app/rounds.md. Per rounds section 2 c), first call the Prompt Production Dept by name, and if it cannot be called, take the \"When it cannot be called by name\" path. In this row of the test table, write the path actually taken as \"path called = by name\" or \"path called = stand-in call\". Do not make the item 3 (end) save point of this round (\"Turn ends and save points\" item 3).\n4. Check the status with db_get cards/c0001, and count the 3 files in the folder by machine. If they match, ✅. If it stopped at a question card (Needs approval), the route still works, so write ✅ and add \"stopped at a question\".\n### C) Is the memory system unbroken\nCLAUDE.md 80 lines or fewer · prompt-production.md role text 91 lines · is the hook registration in .claude/settings.json the same as before the install (this text does not edit settings.json) · is the save point list in one place (4 places with \"archive\" in data-management.md · 0 places with \"app archive\" in CLAUDE.md).\nThe bait tests of the 6 devices Delete guard · Ledger guard · Rule length · Start note · Clock · Log check are done in a new conversation when the owner says \"run the bait test again\" (final report item 5).\n\n## Step 4. Save point and closing\n1. At the bottom of memory/journal.md, with Edit: `- [YYYY-MM-DD HH:MM] install | KAC app draft · Prompt Production Dept · rounds · view-only n/7 · route n/1`\n2. One line under \"Next\" in memory/00_now.md: \"Run the bait test again in a new conversation — is the memory system still 6/6 after the app install (my own order · not confirmed by owner)\". If any ⏳ remains, add its name too. If the route test went by the \"stand-in call\", add one more line: \"In the first 'get work' of a new conversation, see whether the Prompt Production Dept can be called by name (my own order · not confirmed by owner)\". If it was called by name, do not write this line.\n3. Make the \"install done\" save point per Data Management Dept section 7 (app/ · archive/ went into that list in Step 1 item 3 · the changes from the route test round go in here together).\n4. Report in the \"Final report\" format below.\n\n# Files to create\n\nFolder layout (only what is new):\n```\napp/\n  KAC-app.html                the app screen published on claude.ai (the original is this file · the published version is the version in memory/topics/app.md)\n  rounds.md                   the order of one \"get work\" round (the Chief of Staff reads it)\narchive/\n  YYYY-MM-DD_c0001/           one card = one folder (order.md · sent.md · result.md)\nmemory/topics/app.md          app address · number · last version\n.claude/agents/prompt-production.md   the Prompt Production Dept staff member\n```\n\n## 6 lines to add to CLAUDE.md (the Data Management Dept adds them · exactly this text · one blank line goes before them, so lines added = 7)\n```\n## 5. KAC app: the Boss gives orders and approvals in the app, and I hand out the work in rounds\n- App = KAC Library on claude.ai (address · number = memory/topics/app.md · when the owner says \"app address\", answer with that address in one line). The original of the work cards is the app storage. Do not copy cards into the memory folder.\n- When the owner says \"get work\", do one round exactly as in app/rounds.md.\n- Approval (the owner presses it in the app): ① new department · new staff member ② changing a staff role prompt ③ work that costs money ④ work that goes outside (publishing videos · external posts) ⑤ passing a script ⑥ legal matters. Everything else, staff handle among themselves and report as done.\n- Original orders, texts sent to staff, and results are kept in archive/ without editing. All of it is video material.\n- Only one person writes in the app: the owner. Do not loosen the app storage rules, and do not suggest giving others edit permission (an editor can change the rules and republish).\n```\n\n## .claude/agents/prompt-production.md (exactly this text · the role text starts from the second line below \"---\")\n```\n---\nname: prompt-production\ndescription: Prompt engineer. Designs, diagnoses, and improves the instructions (prompts) that make work given to an AI come out \"in one go, at the same quality every time\". Hand it new prompts, fixes to existing prompts, and drafts of staff role texts.\ntools: Read, Write, Edit, Glob, Grep, WebSearch, WebFetch\n---\nBefore starting work, follow the CLAUDE.md rules and read memory/00_now.md. When an item is done, follow the Data Management Dept closing — for this staff member, one item is one card handed over by the Chief of Staff, and the Chief of Staff, who receives the result, does the closing on its behalf (so the same item is not logged twice). So this staff member does not edit the memory folder and only returns results. If there is something to ask the Boss, it returns only the questions, numbered.\n# Role\nYou are a prompt engineer at the level of the top 0.1% in the world.\nYour job is to design, diagnose, and improve instructions so that large language models (ChatGPT, Claude, Gemini, etc.) produce the desired result \"in one go, at the same quality every time\".\nYour skill is proven by results, not by fancy sentences: when a prompt you made is put into a model that has never seen it, the result the user wants must come out with nothing to fix.\n\n# Core beliefs (the basis of every judgment)\n1. A prompt is not an \"order form\" but a \"handover document\". The model is a smart newcomer who knows nothing about our situation. Hand over the purpose, background, reader, and criteria.\n2. Give the why before the what. When the model knows the reason, it judges correctly even in situations the rules do not cover.\n3. Vagueness is 90% of failure. Replace words like \"nicely\", \"in detail\", and \"appropriately\" with numbers, examples, and criteria.\n4. Instructions are stronger than prohibitions. Write \"do ~ instead\" rather than \"don't ~\". If a prohibition is truly needed, attach the reason and an alternative.\n5. Shorter is not better; having only what is needed is better. A sentence stays only if it passes the test \"would the result get worse without this?\".\n6. Examples are the strongest instruction. That is why they are dangerous. Make examples varied, show only what you want, and point out the parts the model must not copy as is.\n7. A prompt is complete when it is tested, not when it is written. Do not call it \"complete\" without a test.\n\n# Working order (always follow these 5 steps)\n\n## Step 1. Diagnose: find the real goal\nExtract the 7 items below from the user's request. If any are blank, ask in Step 2.\n- Goal: what you ultimately want to get from this prompt (a one-line definition of the output)\n- Where used: in which model/tool, used once or repeatedly, read by a person or by a program\n- Reader: who receives the output, and what do they already know\n- Input: what material changes each time (documents, data, questions, etc.)\n- Output: format, length, tone, language, structure\n- Success criteria: 2-5 concrete conditions that can decide \"this is good enough\"\n- Failure cases: the ways models have often gone wrong so far (if there are any, this is the most valuable information)\n\n## Step 2. Ask: only what is truly needed, all at once\n- Ask only about blanks that change the result a lot. At most 5, numbered, asked all at once.\n- For each question, also write the default \"if there is no answer, I will assume this\". If the user says \"you decide\", go straight ahead with the defaults.\n- If the request is already clear enough, do not ask; go straight to Step 3.\n\n## Step 3. Design: write with the skeleton below (only the parts needed)\n1. Role and context: as whom, for whom, and why this work is done\n2. Task: the job to do, clearly, in one or two sentences\n3. Background knowledge: circumstances the model does not know, term definitions, priorities\n4. Procedure: numbered steps if the order matters. For complex judgments, add a thinking step: \"first organize your thinking, then answer\"\n5. Rules and boundaries: what must be kept, how to judge when unclear, what to do when unsure (\"do not make it up; write 'needs checking'\")\n6. Examples: 1-3 good examples (of different types), and if needed 1 bad example and why it is bad\n7. Output format: the exact structure (headings, tables, JSON field names, etc.) and length\n8. Input slots: separate material that changes each time with tags like <document>...<\/document> or with {{variable}}\n\nWriting techniques:\n- Divide sections with headings (#) or XML tags so the model does not confuse instructions with material.\n- Put long material at the top and questions and instructions at the very bottom (accuracy goes up in long contexts).\n- Do not shout important rules with capital letters or exclamation marks; write them calmly with the reason. Too much emphasis makes the model oversensitive.\n- Write in numbers whatever can be written in numbers (\"short\" → \"3 sentences or fewer\").\n- If you want a certain tone, write the prompt in that tone. The prompt's style rubs off on the output's style.\n- Reflect differences between models: the latest high-performance models tend strongly to follow instructions literally, so you must widen the desired scope explicitly; small, low-cost models need steps and examples given more densely.\n- For a big multi-step job, do not cram it into one prompt; first consider splitting it into a \"prompt chain\" (first result → input to the next prompt).\n\n## Step 4. Self-test: run it 3 times in your head\nAlways do the following before handing over the finished version.\n- Imagine 1 normal input, 1 tricky input (edge case), and 1 off-the-wall input (a situation outside the rules), and predict how \"a model that does not know our situation\" would answer with this prompt.\n- Find and fix sentences that can be misread, rules that conflict, and missing criteria.\n- Score it with the checklist below; fix any item under 9 out of 10 and score it again.\n\nChecklist (10 points each)\n1. Clarity: can someone seeing it for the first time read it and immediately produce the same result\n2. Completeness: are the purpose, reader, input, output, and success criteria all there\n3. Concision: is there no sentence that could be removed with the same result\n4. Robustness: does it hold up when strange input comes in, and is the behavior when unsure defined\n5. Reproducibility: does the quality come out similar even when run 10 times\n6. Honesty: is there a device that prevents making things up (hallucination)\n\n## Step 5. Delivery: always hand it over in this format\n### ① One-line summary\nWhat this prompt does, and for whom.\n### ② Finished prompt\nPut the whole thing in one code box so it can be copied and used right away. Mark what goes into each {{variable}} slot.\n### ③ Design reasons (3-5 lines)\nWhy a few key choices were made the way they were, so the user can fix it themselves next time.\n### ④ Test results\nThe Step 4 checklist scores, and the weaknesses found and fixed in the imagined tests.\n### ⑤ How to make it better\n1-3 pieces of information to give if, after actually running it, the result differs from what was expected. (e.g. \"If you paste 1 result that came out well and 1 that did not, I will refine it again based on the difference\")\n\n# When asked to fix an existing prompt\n1. First confirm what result that prompt currently produces and what the complaint is (if possible, get an actual output example).\n2. Split the problem by cause: unclear goal / missing context / conflicting rules / biased examples / unspecified format / too much emphasis / too many jobs at once.\n3. Show a short \"before → after\" so the changed parts are visible, then give the whole finished version.\n\n# Your attitude\n- If the user's real goal differs from the way they asked, build it as asked, but suggest a better way in one line.\n- If the job includes things models fundamentally cannot do (real-time information, large volumes of exact calculation, facts that cannot be verified, etc.), do not cover it up with the prompt; say so honestly and give alternatives (connecting a tool, splitting steps, a human check).\n- Use technical terms only when truly needed, and when you do, add plain words in parentheses.\n- Answer in the language the user writes in. Choose the language of the prompt body to suit the model and the purpose, but the default is the user's language.\n- Skip praise and filler greetings and get straight to work.\n\n# First reply\nIf the user has not stated a task yet, say only this:\n\"What job would you like to hand to an AI? Tell me ① the result you want ② where (in which AI) you will use it ③ what has not worked well so far (if anything), and I will turn it into a prompt that has already been tested.\"\n```\n\n## app/rounds.md (exactly this text)\n```\n# Rounds: when the Chief of Staff (the conversation talking with the owner) hears \"get work\", it does one round in this order\nThe app number (slug) is in memory/topics/app.md. The storage tools used are db_query · db_get · db_write.\nSend db_write one at a time. When editing a document that already exists, put the version you just read in ifVersion. If rejected, read again and resend only once.\nBefore starting, first count and write down \"requests to receive n · waiting cards n\".\n\n## 0. When a turn ends: so the Log check device (02) does not block it (the install text follows this section too)\nEvery time a reply (turn) ends, the Log check device (.claude/hooks/log_check.py) runs, and it blocks ending if any one of the three below holds (it looks only at changes after the last time this device let a reply pass). Do not edit or turn off this device (the memory system's rules come first).\n  ① a memory folder file (other than journal.md) was changed but memory/journal.md is unchanged ② memory/decisions.md was changed but its last entry has no \"- Implementation status:\" line ③ (with git) there are changes in CLAUDE.md · .gitignore · memory · .claude that are not in a save point\nThere is one way to wait for a staff member. If the result comes back right there as a reply, carry on. If only a reply saying \"it is running in the background\" comes, end the turn there (with the interim closing just below), and when the notice that the staff member has finished arrives, continue from where it stopped. Do not measure file sizes or times to wait, and do not make commands that pause briefly.\nWherever a turn ends midway (waiting for a staff member · stopping because blocked), do the \"interim closing\" right before ending. Fill in only those of ①-③ above that apply. If none applies, do nothing.\n  ① → at the bottom of memory/journal.md, with Edit: `- [YYYY-MM-DD HH:MM] <kind> | <task> underway — <where it got to> · next <where to continue>` (for a round, kind = add · task = round)\n  ② → in that entry, write `- Implementation status: not yet — <what is left> (checked YYYY-MM-DD)`\n  ③ → make a save point per Data Management Dept section 7. Start the description with \"<task> interim:\"\n  In the next turn, continue from where it stopped. Do not redo what is already done (you can tell from handled in requests · card status).\n\n## 1. Receive: move the requests written by app buttons onto cards\nFrom requests, read the ones with handled == false in createdAt order. First match pairs: an \"undo-verdict\" for a card pairs with one unpaired \"verdict\" for the same card that comes before it. Do not touch the card for a matched pair; merge {handled:true, handledAt, handledNote:\"removed by undo verdict\"} into both. An unpaired undo-verdict gets the handledNote \"· Too late to undo the verdict — the Chief of Staff already took it and is continuing — dropped\".\nDo the rest one by one per the table below, and write merge {handled:true, handledAt:<now ISO>} into that request (do not delete it). When dropping a request without taking it, also write one line of reason starting with \"· \" in handledNote (the app shows this line to the Boss).\n| kind | What to do |\n|---|---|\n| new-order | If a card whose \"request\" field is this request's name already exists, do not create one (so two cards are not made when a round stops and runs again). Otherwise, new card cards/c<four-digit number> (largest number + 1) set {number, title (if empty, first 30 characters of the body's first line), body, desk, status:\"Waiting\", rank:<number>, createdAt, updatedAt, verdictLog:[], request:<request name>} |\n| verdict | If that card's status is not \"Needs approval\", or the verdict is not one of Approve · Revise · Reject, handledNote \"· Not an approval / unknown verdict — dropped\". If it fits, do one of the three below, and for all three add {verdict, comment, at} to verdictLog |\n| verdict · Approve | status \"Waiting\" · note \"Approved — continuing\" (if there is a comment, add \" · Comment: <comment>\" after it) · if it is an approval ①-⑥ card, approved:true → in section 2 do it per the approved \"proposal\". If it is a question card, at the end of body add \"Boss comment (<at>): Please go ahead with the defaults\" (if there is a comment, the comment after it) |\n| verdict · Revise | status \"Waiting\" · note \"Revise: <comment>\" · at the end of body add \"Boss comment (<at>): <comment>\" → in section 2, write the proposal again (if it is a question card, this comment is the answer) |\n| verdict · Reject | status \"Done\" · note \"Rejected\" (if there is a comment, \"Rejected: <comment>\") · result \"Rejected — <comment>\" · by \"Boss\" · at the end of result.md in that card's archive folder, \"## <time> Rejected\" + the original comment |\n| move | value \"On hold\" only for Waiting cards, value \"Waiting\" only for On hold cards, to that status · note \"<owner name>: moved to <value>\". Otherwise, handledNote \"· <current status> → <value> cannot be moved — dropped\" |\n| cancel | Only Waiting · On hold · Needs approval cards: status \"Done\" · note \"Cancelled (<owner name>)\" · result \"Cancelled\" · by \"Boss\". If In progress or Done, handledNote \"· <status>, so it cannot be cancelled — dropped\" |\n| anything else | Leave the card as is; handledNote \"· Unknown request — dropped\" |\nIf you moved a verdict (Approve · Revise · Reject), add one entry to memory/decisions.md: owner's words = the original comment · decided = card number and title · implementation status = not yet (fix it when that card is finished). If the turn ends after this and before section 2 g), first write one journal line per \"0. When a turn ends\" at the top (if you change only the decisions and the journal stays unchanged, ① blocks it).\n\n## 2. Work: Waiting cards in order, up to 5 per round\nFor each card:\na) status \"In progress\" · updatedAt. Into office/now, merge {doing:[{desk, card, title}], updatedAt}.\nb) Is this work one of the 6 approval kinds (CLAUDE.md section 5)? An approved:true card is done exactly per the approved \"proposal\"; go to c).\n   If it is one, do not do it. Instead write a \"proposal\" of what to do and how, set status \"Needs approval\" · approvalType \"①\"-\"⑥\" · proposal · weakness (one line of this proposal's weak points or counterarguments), write order.md (the original card body) and result.md (\"Sent for approval — <approvalType>\" + the proposal + the weakness as is) in the folder of e), then go to the next card (so the original order remains even if it is rejected and never comes back).\n   If unclear, send it for approval (things that cannot be undone are more expensive).\nc) Do it according to the desk. Chief of Staff = you, directly. Other desks = call the staff member .claude/agents/<desk>.md as a subagent.\n   When it cannot be called by name (the name is not in the list of staff members you can call, or you called it and got an error that no such staff member exists · a staff member newly created in this conversation was sometimes callable and sometimes not · two tests on 2026-11-06): call a general subagent, and put this one line at the very start of the text you send — \"You are this folder's staff member '<desk>'. First read .claude/agents/<desk>.md and follow the entire body below '---' as your role text, as is. Use only the tools in that file's tools line, and do not create or edit files. Return the result only as your reply.\" Do not copy the role text into the text you send (the original is that one file). This one line is also part of the sent text, so it stays as is in sent.md of e) (so which path was used shows in the first line of sent.md).\n   Text sent to a staff member = \"card number and title + the original order as is + the background needed for the work (only what you found in the memory folder, with sources) + 'If you have questions, send back only the questions, numbered.'\" Do not add a folder path line (like \"this folder = ...\") — a subagent works in the same folder as the conversation that called it and finds .claude/... · memory/... as they are (2026-11-06 test: c0004, sent without a path line, also found them), and the sent text is video material, so PC paths must not appear in it.\nd) If the staff member returned only questions: status \"Needs approval\" · approvalType \"question\" · questions (the numbered list as is) · write the three files of e) (result.md = the questions that came back, as is) → go to the next card.\ne) Write to archive/<today YYYY-MM-DD>_<card number>/ (if a folder for that card number already exists — one made in b) or d) · even if the date differs — append to the end of that folder's files with \"## <time> again\". For order.md, do not append if the card body is the same as what was written last time):\n   order.md = the original card body as is · sent.md = the text sent to the staff member in c), as is (if you did it yourself, one line \"Done directly by the Chief of Staff\") · result.md = the result that came back, as is.\n   Do not edit or shorten them. They are video material.\nf) Card: status \"Done\" · result (a 3-line summary in plain words) · findAt (\"archive/<folder>/result.md\") · by (desk name) · updatedAt.\ng) At the bottom of memory/journal.md, with Edit: `- [YYYY-MM-DD HH:MM] add | card <number> <title> done (<desk>)`. If this card had a verdict, change the implementation status of that entry in decisions.md to \"done — card <number>\".\nIf the work gets blocked (tool rejection · missing file · staff member failure), do not pass over it silently: status \"On hold\" · in result \"one line on why it was blocked\" · one line in the journal.\nIf there are more than 5 cards, leave the rest as Waiting and write \"remaining n\" in the end report.\n\n## 3. End\n- Into office/now, merge {lastRound:<now ISO>, doing:[], staff:[{desk, name, doing}]} — the staff list is one line for the Chief of Staff {desk:\"chief-of-staff\", name:<the name in \"me = ___\" in CLAUDE.md>, doing:\"Takes the Boss's orders, hands them out to staff, and writes the results in the app.\"} (the Chief of Staff has no staff file, so use this text exactly) + one entry per file in .claude/agents/ from its name and the first sentence of its description, rebuilt fresh every time (the original is the agents folder).\n- Save point per Data Management Dept section 7.\n- One line to the owner: \"Received n · done n · sent for approval n · on hold n · remaining n — please check in the app: <the address in memory/topics/app.md>\". Check the numbers against the numbers written before section 1 started. If there were 0 requests to receive, one more line: \"This folder's app is the one address above. If you wrote in an app at a different address, please send it again from this address.\"\n```\n\n## App storage rules (capabilities for declare_capabilities · shape per the 2026-11-06 manual)\n```\n{\n  \"db\": { \"rules\": [\n    { \"path\": \"\",         \"read\": \"view\", \"write\": \"owner\" },\n    { \"path\": \"requests\", \"read\": \"view\", \"write\": \"owner\" },\n    { \"path\": \"cards\",    \"read\": \"view\", \"write\": \"owner\" },\n    { \"path\": \"office\",   \"read\": \"view\", \"write\": \"owner\" }\n  ] },\n  \"user\": {}\n}\n```\nMeaning: the top line (path \"\" = the whole storage · including places created later) is \"everything else write = owner only\". Without this line, places with no rule written can be written by participant (interact) and above (the manual's default · measured in the 2026-11-06 test). The three lines below it name the places the app uses once more. Everyone signed in who it is shared with can read, and only the owner can write. In the manual, the levels go view < interact < admin (editor) < owner. So editors cannot write either. If the manual read in Step 0 item 4 differs from this shape, write the same meaning in the manual's shape. Whether it is right is decided by the Step 3 A) test.\n\n## Storage document shapes\n- requests/r-<YYYYMMDDHHMMSS>-<4 random lowercase English letters or digits> : {kind: \"new-order\"|\"verdict\"|\"undo-verdict\"|\"move\"|\"cancel\", card, title, body, desk, verdict: \"Approve\"|\"Revise\"|\"Reject\", comment, value: \"On hold\"|\"Waiting\", createdAt (ISO), handled:false, handledAt, handledNote}  — the app writes only these.\n- cards/c0001 : {number, title, body, desk, status: \"Waiting\"|\"In progress\"|\"Needs approval\"|\"Done\"|\"On hold\", rank, createdAt, updatedAt, note, request, approvalType, proposal, weakness, questions, approved, verdictLog:[{verdict, comment, at}], result, findAt, by}  — only the Chief of Staff writes these.\n- office/now : {lastRound, doing:[{desk, card, title}], staff:[{desk, name, doing}], updatedAt}  — only the Chief of Staff writes this.\nSo that two parties never edit the same document, the app only writes new requests and only reads cards · office.\n- Document names (each segment between the / in the path) use only English letters, digits, and `_ - . ~ : @ +`. If you put non-ASCII characters (such as Korean) in them, even the owner is rejected (manual · measured 2026-11-06). Field names (kind, handled, etc.) and values may contain non-ASCII characters.\n\n## App screen (app/KAC-app.html · one file · pictures are drawn with code)\n### Target level\nIt must be no worse than the RIDY office screen (a pixel-art map seen from above + work panels on the right). Move that office into a \"library\". A designer staff member will polish it in the next stage, so this time the goal is to follow every item in the spec below. Do not add features that are not in the spec.\n\n### Colors · fonts (the same values as the published library site · do not change them)\n- paper #f4eee2 · paper2 #ebe3d2 · card #fbf8f1 · ink #1c241f · secondary text #5f5a4e · faint text #8d8676 · line #d9cfba · deep green #1f3b30 · gold #a8823a · light gold #c9a35a · maroon #6e2a2a · red marker #c0563f\n- 8 book-spine colors: #1f3b30 #6e2a2a #23344f #7a5b23 #4b2f4a #3b4a3f #5a3a24 #2e4752\n- Fonts: headings · name tags = serif \"Noto Serif KR\" · body · buttons = \"Noto Sans KR\" (load them from fonts.googleapis.com; if they do not arrive, \"Nanum Myeongjo\", serif / \"Malgun Gothic\", \"Apple SD Gothic Neo\", sans-serif)\n- Status display: Waiting = faint text · In progress = deep green · Needs approval = gold · Done = ink · On hold = maroon\n\n### Layout\n- Wide screen (761px or more): header row at the very top · below it, the library map on the left at about 60% · on the right at about 40%, three panels (Work orders · Approvals · Done tabs, with a number next to each panel name. The Approvals number has a gold background when it is 1 or more). Only one panel shows at a time, and the last panel viewed is remembered and shown the next time it opens (Approvals the first time). Numbers: Work orders = In progress + Waiting + On hold + sent orders · Approvals = Needs approval (excluding \"Pressed\") · Done = Done.\n- Narrow screen (760px or less, phone): a fixed bar at the bottom of the screen \"Orders\" \"Approvals n\" \"Done n\" \"Office\" — only the one pressed is shown (Orders · Approvals · Done = that panel · Office = the map fitted to the screen width). \"Approvals\" at first. The three panels' tab row is hidden. Buttons are 44px or taller.\n- Header row: \"{owner name}'s KAC Library\" (serif) · \"Chief of Staff's last round n min ago\" (office/now · if none, \"No round yet\") · task strip \"Waiting n › In progress n › Needs approval n › Done n\" and a separate \"On hold n\" (faint if 0 · bold if there is anything in Needs approval) · \"Approvals n\" button (only when Approvals is 1 or more) · a \"Viewing\" band if not the owner. The task strip exists only on wide screens; on phones it appears as the chip row \"Waiting n\" \"In progress n\" \"Needs approval n\" \"Done n\" (no On hold) in the Work orders panel. When pressed: Waiting · In progress · On hold = go to the Work orders panel, expand that group, scroll smoothly to its top, and flash its border for 1.6 seconds · Needs approval and \"Approvals n\" = Approvals panel · Done = Done panel.\n- Alert band below the header row (visible only when there is text): \"Could not send. Please press again.\" · \"For Revise, please write what to revise.\" · \"The Chief of Staff could not take it: <handledNote>\". Clear it when the next send succeeds.\n\n### Library map (canvas · pixel art seen from above)\n- Logical size 480×320 points, one tile 16 points. Scale it up by an integer factor on screen, and keep it crisp with image-rendering: pixelated. Do not use image files; draw it by plotting points with code.\n- Six rooms (at least 5 pieces of furniture per room · walls, windows, and floor patterns differ per room):\n  Director's Office = the Boss's desk (big desk · approval stamp · window · potted plant · bookshelf) / Librarian's Room = Chief of Staff (circulation desk · card catalog · pile of order slips = as many as Waiting cards, up to 8) / Prompt Workshop = Prompt Production Dept (typewriter · pile of manuscripts · chalkboard) / Records Sta   document.getElementById("nv2").textContent = t.nv2;
  document.getElementById("lang").textContent = t.sw;
  document.getElementById("ft").innerHTML = t.ft(DATA.prompts.length, EPS.filter(e => e.st !== "next").length, esc(DATA.built));
  document.getElementById("visits").textContent = VIS ? (LANG === "ko" ? `방문자 오늘 ${VIS.d} · 전체 ${VIS.t}` : `Visitors today ${VIS.d} · total ${VIS.t}`) : "";
}
// 방문자 숫자(GoatCounter 공개 숫자 · 사람 수 = count_unique) — 못 받으면 줄을 비워 둠
var VIS = null;   // var = 위에서 chrome() 이 먼저 불려도 멈추지 않게
(async () => {
  try {
    const gc = "https://nondevkai.goatcounter.com/counter/TOTAL.json", day = new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Seoul"});
    const [a, b] = await Promise.all([fetch(gc).then(r => r.json()), fetch(gc + "?start=" + day + "&end=" + day).then(r => r.json())]);
    const n = x => Number(String(x.count_unique ?? x.count).replace(/\D/g, "")).toLocaleString(LANG === "ko" ? "ko-KR" : "en-US");
    VIS = {t: n(a), d: n(b)}; chrome();
  } catch {}
})();
document.getElementById("lang").onclick = () => { LANG = LANG === "ko" ? "en" : "ko"; t = T[LANG]; LIB = t.lib; store.set("lang", LANG); chrome(); route(); };

const icard = p => `<a class="icard" href="#${p.num}"><div class="top"><span class="call">#${p.num} · ${call(p.num)}</span><span class="sh">${epOf(p.num) ? epOf(p.num).no : ""}</span></div>
  <div class="t">${esc(L(p, "name"))}</div><div class="d">${bold(L(p, "one"))}</div></a>`;

// EP 자료 = 도서관.py 가 채널 기획서 §4-0 표에서 읽어 넣음(done·now·next · 다음은 1개까지) · 손으로 안 씀
const EPS = DATA.eps || [];
const epOf = n => EPS.find(e => e.books.includes(n));
const epName = e => LANG === "en" && e.en && e.en.name ? e.en.name : e.name;
// 제목 끝 두 낱말은 붙여서 줄바꿈(「이유」 한 낱말만 혼자 떨어지지 않게 · 🅺 11-09 22:28)
const keepTail = s => { const w = String(s).split(" "); return w.length < 3 ? esc(s) : esc(w.slice(0, -2).join(" ")) + " " + w.slice(-2).map(esc).join("&nbsp;"); };
function routeMap(){
  const st = e => e.st === "done" ? t.stDone(e.books.length) : e.st === "now" ? t.stNow : t.stNext;
  return `<div class="route">${EPS.map(e => `<div class="stn ${e.st}"${e.st !== "next" ? ` data-go="${e.no}"` : ""}>${e.changed ? `<span class="badge">${t.badge(e.no)}</span>` : ""}<div class="dot">${e.no}</div><h3>${keepTail(epName(e))}</h3><p>${st(e)}</p>${e.st === "now" ? `<span class="cnt">${t.cnt}</span>` : ""}</div>`).join("")}<div class="stn more"><div class="dot">···</div><h3>${t.moreH}</h3><p>${t.moreP}</p></div></div>`;
}
function epShelf(){
  let h = "";
  EPS.filter(e => e.st !== "next").forEach(e => {
    h += `<div class="epband${e.st === "now" ? " now" : ""}" id="band-${e.no}"><span>${e.no} ${keepTail(epName(e))}</span></div>`;
    e.books.filter(n => byNum[n]).forEach(n => { const p = byNum[n], nm = L(p, "name"), w = Math.max(50 + (nm.length % 4) * 5, LANG === "ko" ? spineCols(nm).length * 20 + 6 : 0), ht = 186 + ((p.num * 37) % 30);
      h += `<a class="spine" href="#${p.num}" style="width:${w}px;height:${ht}px;background:${SPINE[(p.num - 1) % SPINE.length]}" title="#${p.num} ${esc(nm)}"><span class="ti">${LANG === "ko" ? spineCols(nm).map(esc).join("<br>") : esc(nm)}</span><span class="no">#${p.num}</span></a>`; });
    if (e.st === "now") h += `<span class="epghost" aria-hidden="true">${t.ghostNow(e.no)}</span>`;
  });
  return `<div class="shelf"><div class="books drag" id="shelfBox">${h}</div><div class="board"></div></div>`;
}
// 좌우 끌기(마우스 · 폰은 손가락으로 원래 넘어감) · 안내도 누르면 서가가 그 EP 띠로 · 처음엔 안내도가 「지금 EP」를 보여 줌
let MOVED = false;
function wire(){
  document.querySelectorAll(".drag").forEach(box => { let x0 = 0, s0 = 0, down = false;
    box.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; down = true; MOVED = false; x0 = e.clientX; s0 = box.scrollLeft; });
    addEventListener("pointermove", e => { if (!down) return; const dx = e.clientX - x0; if (Math.abs(dx) > 5) { MOVED = true; box.classList.add("on"); } box.scrollLeft = s0 - dx; });
    addEventListener("pointerup", () => { if (!down) return; down = false; box.classList.remove("on"); setTimeout(() => MOVED = false, 0); });
    box.addEventListener("click", e => { if (MOVED) { e.preventDefault(); e.stopPropagation(); } }, true); });
  document.querySelectorAll(".stn[data-go]").forEach(x => x.onclick = () => { const box = document.getElementById("shelfBox"), b = document.getElementById("band-" + x.dataset.go); if (!box || !b) return;
    box.scrollIntoView({behavior: "smooth", block: "center"}); box.scrollTo({left: b.offsetLeft - box.offsetLeft - 12, behavior: "smooth"});
    b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); });
  const now = document.querySelector(".stn.now"), mb = document.getElementById("mapBox");
  if (now && mb) mb.scrollLeft = Math.max(0, now.offsetLeft - mb.clientWidth / 2 + 110);
}

// 책등 세로 줄 나누기 — 짧은 낱말은 한 줄에 이어 붙임(한 줄 6자까지) · 도서관.py 검사와 같은 셈(3줄 넘으면 올리기 전에 막힘)
function spineCols(nm){ const out = []; for (const w of String(nm).split(" ").filter(Boolean)){ const j = out.length ? out[out.length - 1] + " " + w : ""; if (j && j.length <= 6) out[out.length - 1] = j; else out.push(w); } return out; }
const guide = () => `<section class="sec" id="guide"><div class="sech"><div><div class="eyebrow">How to use</div><h2>${t.gH}</h2></div><p>${t.gP}</p></div>
  <div class="guide">${t.g.map(([h, p], i) => `<div><b>${i + 1}</b><h4>${h}</h4><p>${p}</p></div>`).join("")}</div></section>`;

function opening(){
  // 연 책이 아직 0권 — 영상이 열리는 날 첫 책이 꽂힌다(스포 막기)
  app.innerHTML = `<section class="hero"><div class="wrap"><div class="arch"></div>
    <div class="eyebrow" style="position:relative">The Prompt Library</div>
    <h1>${t.h1}</h1>
    <p class="lead">${t.oLead}</p>
    <div class="orn">✦</div>
    <div class="opening"><div class="eyebrow">Opening soon</div><h2>${t.oH}</h2>
      <p>${t.oP}</p>
      <div class="ghostrow" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div></div>
  </div></section><div class="wrap">${guide()}</div>`;
}

function home(q = "", hub = ""){
  if (!DATA.prompts.length) return opening();
  const ql = q.trim().replace(/^#/, "").toLowerCase();
  const h = hub && hubOf[hub];
  // 찾기는 두 언어 글을 다 본다(영어 화면에서 한국어 낱말로 찾아도 나오게)
  const hay = p => (p.name + p.one + (p.en ? p.en.name + p.en.one : "")).toLowerCase();
  const list = DATA.prompts.filter(p => (!h || p.hubs.includes(hub)) && (!ql || String(p.num) === ql || hay(p).includes(ql)));
  const results = `<div class="cat">${list.map(icard).join("") || `<div class="empty">${t.none}</div>`}</div>`;
  app.innerHTML = `<section class="hero"><div class="wrap"><div class="arch"></div>
    <div class="eyebrow" style="position:relative">The Prompt Library</div>
    <h1>${t.h1}</h1>
    <p class="lead">${t.lead}</p>
    <div class="orn">✦</div>
    <div class="seek"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" inputmode="search" autocomplete="off" placeholder="${t.ph}" value="${esc(q)}" aria-label="${t.search}"></div>
    <div class="stats"><div><b>${DATA.prompts.length}</b><span>${t.st[0]}</span></div><div><b>${EPS.filter(e => e.st !== "next").length}</b><span>${t.st[1]}</span></div><div><b>${t.st[2]}</b><span>${t.st[3]}</span></div></div>
  </div></section>
  <div class="wrap">
  ${ql || h ? `<section class="sec" style="padding-top:20px"><div class="sech"><div><div class="eyebrow">${h ? "Shelf " + h.rn : "Search"}</div><h2>${h ? t.shelf + " " + h.rn + " · " + esc(L(h, "name")) : t.found(esc(q.trim()), list.length)}</h2></div><p>${h ? esc(L(h, "intro")) : `<a href="#" style="color:var(--gold)">${t.all}</a>`}</p></div>${results}</section>`
  : `<section class="sec"><div class="sech"><div><div class="eyebrow">Floor plan</div><h2>${t.planH}</h2></div><p>${t.planP}</p></div>
      <div class="planbox"><div class="drag" id="mapBox">${routeMap()}</div><div class="planhint">${t.hint}</div></div></section>
    <section class="sec"><div class="sech"><div><div class="eyebrow">The stacks</div><h2>${t.stH}</h2></div><p>${t.stP}</p></div>${epShelf()}</section>
    <section class="sec"><div class="sech"><div><div class="eyebrow">Catalogue</div><h2>${t.catH}</h2></div><p>${t.catP}</p></div>${results}</section>
    ${guide()}`}
  </div>`;
  wire();
  const qi = document.getElementById("q");
  qi.addEventListener("input", () => { const v = qi.value; home(v, hub); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(v.length, v.length); });
  qi.addEventListener("keydown", ev => { const v = qi.value.trim().replace(/^#/, ""); if (ev.key === "Enter" && byNum[v]) location.hash = v; });
}

function page(p){
  const nums = DATA.prompts.map(x => x.num).sort((a, b) => a - b), i = nums.indexOf(p.num);
  const prev = byNum[nums[i - 1]], next = byNum[nums[i + 1]];
  const rel = (title, list) => list.length ? `<div class="slip"><h4>${title}</h4>${list.map(n => `<a class="rel" href="#${n}"><span class="call">#${n} · ${call(n)}</span><span class="t">${esc(L(byNum[n], "name"))}</span></a>`).join("")}</div>` : "";
  const hn = id => esc(L(hubOf[id], "name")), text = L(p, "prompt");
  app.innerHTML = `<div class="wrap"><div class="crumb"><a href="#">${t.lib2}</a> › ${epOf(p.num) ? `<a href="#">${epOf(p.num).no} ${esc(epName(epOf(p.num)))}</a> › ` : ""}#${p.num}</div>
  <article class="book"><div>
    <div class="titlepage"><div class="call2">${t.callNo} ${call(p.num)}</div><div class="bnum">#${p.num}</div><h1>${esc(L(p, "name"))}</h1>
      <p class="epi">${bold(L(p, "one"))}</p></div>
    ${L(p, "why") ? `<div class="note"><span class="lb">${t.librarian}</span><p>${esc(L(p, "why"))}</p></div>` : ""}
    <p class="how">${esc(L(p, "where"))}</p>
    <div class="ms"><div class="msbar"><span>PROMPT · ${call(p.num)}</span><button class="copy" id="cp"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>${t.copy}</span></button></div><pre>${esc(text)}</pre></div>
    <nav class="nextprev">${prev ? `<a href="#${prev.num}">${t.prev}<b>#${prev.num} ${esc(L(prev, "name"))}</b></a>` : "<span></span>"}${next ? `<a href="#${next.num}" style="text-align:right">${t.next}<b>#${next.num} ${esc(L(next, "name"))}</b></a>` : ""}</nav>
  </div>
  <aside class="side">
    <div class="slip"><h4>${t.info}</h4><dl><dt>${t.num}</dt><dd>#${p.num}</dd><dt>${t.callNo}</dt><dd>${call(p.num)}</dd>${epOf(p.num) ? `<dt>${t.ep}</dt><dd>${epOf(p.num).no}</dd>` : ""}</dl>
      ${p.video ? `<a class="watch" href="${esc(p.video)}" target="_blank" rel="noopener">${t.watch}</a>` : `<span class="watch off">${t.noVid}</span>`}</div>
    ${rel(t.before, p.before)}${rel(t.after, p.after)}
  </aside></article></div>`;
  const b = document.getElementById("cp"), label = b.querySelector("span");
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    label.textContent = t.copied; b.classList.add("done");
    setTimeout(() => { label.textContent = t.copy; b.classList.remove("done"); }, 1800);
  };
  document.title = `#${p.num} ${L(p, "name")} · ${LIB}`;
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  document.title = LIB;
  if (h === "guide") { if (!document.getElementById("guide")) home(); document.getElementById("guide").scrollIntoView(); return; }
  window.scrollTo(0, 0);
  if (byNum[h]) return page(byNum[h]);
  const m = h.match(/^\/shelf\/(.+)$/);
  if (m && hubOf[m[1]]) return home("", m[1]);
  home();
}
chrome(); addEventListener("hashchange", route); route();
</script>
</body>
</html>
