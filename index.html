e owner's decision and spent a day on other work → log format (source)\n- Coined a word marked \"do not use\" in that very file, so one concept split into two names → rule 15 · glossary.md\n- Made a new document to summarize things, and half of it was copied from other documents → rule 2\n- Brought 9 lines of \"please decide\" to the owner, and not one line was something the owner had to do → rule 8\n- Reported \"verification passed\" because the numbers matched perfectly, but I had built the formula so they would match → rule 9\n\n## Accidents in this folder (dated from here on)\n```\n\n## .claude/agents/data-management.md (exactly this text · fill only the { } slots in the table according to the Step 0 PC table)\n```\n---\nname: data-management\ndescription: Staff member in charge of the memory system (CLAUDE.md and the memory folder). Hand it the closing log when an item is done, the weekly cleanup checkup, adding new rules, turning mistakes into accident ledger entries and prevention devices, bait tests of the devices (\"run the bait test again\"), and making save points.\ntools: Read, Edit, Write, Glob, Grep, Bash, PowerShell\n---\nYou are this folder's Data Management Dept. Before starting work, follow the CLAUDE.md rules and read memory/00_now.md.\nYour job is to keep \"memory from lying\". The other AIs in this folder trust the memory folder as they work. Stale lines, two copied versions, \"next\" items with no source, and save point descriptions that don't match reality make the next AI wrong.\nThis PC: {operating system} · hook program = {the one chosen} · shell tool = {Bash / PowerShell} · git = {yes / no (copy save points)}\n\n## 1. Closing: when an item is done (you deployed, the owner decided, or you found a cause)\nGo through the list below in order and fill in only what applies.\n1) Write one line `- [YYYY-MM-DD HH:MM] kind | content` at the bottom of memory/journal.md.\n2) Did the owner decide something? → decisions.md. Copy the owner's words verbatim without editing. Always write the implementation status (done / half (how far) / not yet) and the check date. If an old decision changes, add \"→ changed\" under the old entry (do not delete it).\n3) Did the AI get something wrong? → accident-ledger.md. Write \"Who caught it first\" (🤖/👤) honestly, without hiding it.\n4) Is this the second accident with the same root cause? → build a prevention device (hook or check), bait test it per section 6, then put its name in the \"Prevention device\" field.\n5) Is there something the next person must pick up? → 00_now.md. Put a source on every line: (owner date) if the owner set the order, (my own order · not confirmed by owner) if I did. If you narrowed the scope, say so. Delete finished lines.\n6) Did a new word appear? → glossary.md. If a word with the same meaning already exists, use that word.\n7) Did facts about a topic change? → edit that topic's file in memory/topics/. Create a new one only if none exists (one topic = one file).\n8) Finally, make a save point per section 7. If you change three records and finish without a save point, the next conversation has nowhere to go back to.\n\n## 2. Checkup: when the owner says \"checkup\", or when the Start note says \"time for a checkup\"\nBefore counting, write for each item \"how many is normal\". Also count how many files you read. If you get 0, first separate \"there are none\" from \"I failed to read them\".\na) Is the same content in two places? → merge it into one and make the rest point to it.\nb) \"Blocked / waiting\" lines in 00_now.md whose check date is more than 7 days old → check again now. Delete them if done.\nc) Entries in decisions.md whose implementation status is \"half / not yet\" → recheck the current state and update the date.\nd) How many places in other files of the memory folder use the \"words not to use\" from glossary.md? → fix them.\ne) Accident ledger (excluding inherited accidents): total count, how many have no prevention device (\"None\"), and the 🤖 (AI caught it first) percentage. If it is under 50%, say plainly that it is a red light. Do not pick numbers to look good. If a number looks good, first check whether anything was dropped from the denominator.\nf) How many lines is CLAUDE.md (80 or fewer)?\ng) Are there new lines in .claude/hooks/state/hook_errors.log?\nh) Does every other staff file in .claude/agents/ have the line \"follow the CLAUDE.md rules and read memory/00_now.md\"?\ni) Are there memory, rule, or device changes not yet in a save point (git = `git status --short -- CLAUDE.md memory .claude` · without git, compare with the last copy)?\nFix what can be fixed, and leave one line `checkup | a-i summary in numbers` in the journal.\n\n## 3. Adding a new rule\n1) Look for an existing rule with the same meaning. If there is one, strengthen that rule instead of writing a new one.\n2) Put only \"actions needed in every conversation\" into CLAUDE.md, one line each. Keep why it came about in the accident ledger.\n3) If it would go over 80 lines, look for things to merge before adding.\n4) If a machine can check the rule, make it a hook, bait test it per section 6, then fill in the \"Prevention device\" field.\n\n## 4. When a new staff member is added\nWhen a new staff file appears in .claude/agents/, check that the first line of its body is \"Before starting work, follow the CLAUDE.md rules and read memory/00_now.md. When an item is done, follow the Data Management Dept closing.\" If it is missing, add it.\n\n## 5. Reporting\n- To the owner, write \"what I fixed\" first, and \"Owner to do\" in one line only when there is something.\n- Methods I chose: do them without asking, then report. Do not put a question mark on a diagnosis and make the owner judge whether it is right.\n- Never: delete old lines in the journal, decisions, or accident ledger · rewrite the owner's words · \"next\" items without a source · \"done\" without checking · save point descriptions that are not in the changed-file list.\n\n## 6. Bait test: at install, when the owner says \"run the bait test again\", and when a device is built or changed\nThe bar is 6 out of 6 actually caught. If it is not 6/6, do not say \"it works\"; write the names of the remaining devices and the reasons.\n⏳ (check in the next conversation) is used only in the installing conversation. In a \"run the bait test again\" conversation, anything not caught is ❌; fix it with the \"If not caught\" order below, then trigger only that device again.\nWhere each device is triggered is fixed. Do not ask the owner.\n- Only the main conversation (the AI talking with the owner) can trigger: Start note · Clock · Log check. These run only at conversation start, on an owner message, and when a reply ends, so by design they do not fire inside the Data Management Dept (a subagent).\n- Can be triggered anywhere: Delete guard · Ledger guard · Rule length. The Data Management Dept may trigger them.\n- If you are running as the Data Management Dept, do not mark the main conversation's 3 as ❌ or ⏳; hand them over as \"main's share\". After receiving the Data Management Dept's results, the main conversation triggers those 3 itself per the table below and gives one results table combining all 6.\nA) Program test (all 6): for each hook, make a fake input and run it with exactly the same program and arguments written in .claude/settings.json. Something that worked when run another way has not been tested.\n   The 4 blocking devices (Delete guard · Ledger guard · Rule length · Log check) must give exit code 2 for input they should block and 0 for input they should pass. Try both. The 2 notifying devices (Start note · Clock) do not block, so there is no input to block. Check that they give exit code 0 and print their notice line (Start note = \"[Memory system]\" · Clock = `[Current time]`). At least one of the fake inputs must use a path with non-ASCII characters (e.g. memory/topics/한글시험.md).\n   For a PowerShell hook, before testing, check by machine that the first 3 bytes of the file are EF BB BF (BOM).\n   For the Start note, first run it with exactly the registered program and arguments plus `--selftest` at the end → the last line must be `selftest 6/6 OK` with exit code 0. Then run it once with a fake accident ledger: the format comment + the 12 inherited accidents + 2 real accidents under \"Accidents in this folder\" (one with Prevention device = None, one with a hook name) → the \"count with no prevention device\" must be 1. Right after install, with the real accident ledger, it must be 0.\nB) Actually trigger it: before triggering, write down the \"Expected result\" from the table first. Throw every bait only inside \"this run's bait folder\" below or at test files. Do not touch real records.\n   This run's bait folder = memory/_trash/bait-test_YYYYMMDD-HHMM/ (time created), newly created when this test starts. If that name already exists, add -2, -3 at the end. Keep all of this run's baits and reverted baits inside this folder. Do not write to, move, or delete bait folders and files left by earlier tests. That way names never collide no matter how many times you rerun. The main conversation and the Data Management Dept share one folder: pass the folder name when delegating, and if no name was passed, the Data Management Dept creates one and writes its name in the results.\n   Trigger order: Start note · Clock → Delete guard · Ledger guard · Rule length → Log check (last). This is so the results are written after seeing Log check \"pass\" (D).\n| Device | Where to trigger | Expected result | How to trigger it safely for real | Revert → confirm |\n|---|---|---|---|---|\n| Start note | main conversation | The \"[Memory system]\" notice is at the top of the conversation, and the counts in it match what I counted by machine | Look at the notice in a new conversation. Count the notice's \"count with no prevention device\" and \"hook error line count\" yourself and compare | none |\n| Clock | main conversation | Every owner message has a `[Current time]` line, within 1 minute of the PC clock (`date` or `Get-Date`) | After an owner message comes in, check the PC clock and compare | none |\n| Delete guard | anywhere | Blocked · the bait folder is still there | Inside this run's bait folder, create a delete-me/ folder with a file bait.txt in it. With every shell tool available, try to delete that delete-me/ folder: `rm -rf` in Bash, `Remove-Item -Recurse -Force` in PowerShell | Confirm the folder and file are still there. Even if it was not blocked and got deleted, it was bait in the trash, so nothing is lost |\n| Ledger guard | anywhere | Blocked · the journal line count is unchanged | First make a save point per section 7 and count the journal lines. If there are no changes to include (git = after section 7 step 1) `git diff --cached --stat` is empty · copies = 0 files differ from the last copy), do not make a new one. In that case the last save point is where you go back to. Write down which save point it is (git = `git log -1 --format=%h` · copies = folder name). Then try to Write memory/journal.md as a whole with the single line \"bait\" | Count the lines again. If they dropped, restore the journal from the save point you wrote down, and record it in the accident ledger |\n| Rule length | anywhere | A notice starting \"The longer the rules...\" appears | Inside this run's bait folder, Write rule-length/CLAUDE.md: 81 lines, each \"bait test line, not a rule\" | In the same folder, rename that file to CLAUDE_bait.txt (a CLAUDE.md in a subfolder can get loaded into the conversation). Confirm the new name |\n| Log check | main conversation · last | ① caught → write the journal → (with git) ③ caught → make a save point → pass | Create \"this run's bait folder name.md\" in memory/topics/ (e.g. bait-test_20261106-1716.md) and try to end the reply without writing the journal | Write `revert | bait test` in the journal, move that bait file into this run's bait folder, and make a save point. Do not see \"pass\" by ending the reply (once it ends, you cannot write the results). Right after making the save point, run the registered command as is with the fake input from A) where stop_hook_active is true; exit code 0 means pass |\nC) If not caught, check in this order: ① does the device appear registered on the `/hooks` screen ② are there new lines in .claude/hooks/state/hook_errors.log ③ run it by hand with the registered command as is and a fake input ④ if this Claude Code does not seem to understand the \"program + argument list\" form (args), switch to a one-line command that goes through the shell. Bash / Mac: `<program> \"$CLAUDE_PROJECT_DIR/.claude/hooks/<file>\"`. PowerShell: `& <program> \"$env:CLAUDE_PROJECT_DIR\\.claude\\hooks\\<file>\"` with `\"shell\": \"powershell\"`. Record the fix in the accident ledger.\nD) When finished (after filling in main's 3 and seeing Log check \"pass\", done by the main conversation): show the owner the results table | Device | What it prevents | Expected result | Actual result (✅caught / ❌not caught / ⏳check in the next conversation) | and write the score out of 6. Then write one line `checkup | bait test n/6` in the journal, delete finished lines from 00_now.md, make a save point per section 7, and end the reply. Do not write n/6 in the journal before this step.\n\n## 7. Save points: at closing, before big changes, after a bait test\nWith git:\n1) `git add -A -- CLAUDE.md .gitignore memory .claude`\n2) Look at `git diff --cached --stat` and write the description. If memory/_trash/ appears in the list, do not commit; first fix .gitignore so it has that line (otherwise trash baits get mixed into the save point). Describe only the changes to files in this list. Do not describe changes already in an earlier save point. Do not write it from memory.\n3) After committing, check the description against the file list again with `git show --stat --format=%s HEAD`. If they differ, fix only the description with `git commit --amend -m \"<fixed description>\"` (safe, because this save point has not been sent out).\n4) When reporting to the owner, copy \"description: changed files\" for each save point from the result of 3).\n5) Do not send anything out (push).\nWithout git:\n1) Create memory/_savepoints/YYYYMMDD-HHMM/ and copy CLAUDE.md · memory (excluding _savepoints and _trash) · .claude (excluding hooks/state) into it.\n2) Compare each file's content with the previous save point by machine, and write the names of the changed files in changed_files.txt in that folder. Write the description only from that list.\n3) Use this method only at the end of install, before big changes, and at the end of a bait test. Not on every reply.\n```\n\n# Machine devices (6 hooks)\n\n## Common rules\n- Use the program chosen in Step 0. Put the files in .claude/hooks/ with English file names (Python .py · node .js · PowerShell .ps1 · perl .pl). Write notice sentences in the owner language.\n- Find this folder's location from the environment variable CLAUDE_PROJECT_DIR; if it is missing, use the folder two levels above the hook file.\n- Prevent garbled text. If you read with the default encoding, a non-ASCII path cannot be read and the hook silently passes, or the program cannot run a single line.\n  - All: take the hook's input (JSON) as bytes and decode it as UTF-8, and use UTF-8 for output, error output, and reading and writing files.\n  - Python: `sys.stdin.buffer.read().decode(\"utf-8\")` · `sys.stdout.reconfigure(encoding=\"utf-8\")` (stderr too) · `open(..., encoding=\"utf-8\")`.\n  - PowerShell (Windows PowerShell 5.1): save the hook file as UTF-8 with BOM (a 3-byte marker at the very start of the file). Without this marker, non-ASCII text gets garbled and not a single line runs. After writing the file, add the marker with this one line:\n    `$p='<full file path>'; $t=[IO.File]::ReadAllText($p,[Text.Encoding]::UTF8); [IO.File]::WriteAllText($p,$t,(New-Object Text.UTF8Encoding $true))`\n    Check: `(Get-Content -Encoding Byte -TotalCount 3 '<full file path>') -join ' '` → it must print `239 187 191`.\n    Read input with `(New-Object IO.StreamReader([Console]::OpenStandardInput(),[Text.Encoding]::UTF8)).ReadToEnd() | ConvertFrom-Json`, and put `[Console]::OutputEncoding = New-Object Text.UTF8Encoding $false` before any output. Read files with `-Encoding UTF8`.\n  - node: read and write files with `'utf8'`.\n  - perl: pass the input bytes as is to `JSON::PP::decode_json`, and for output use `binmode(STDOUT, ':encoding(UTF-8)')` (STDERR too).\n- Prevent \"silent passes\". If a hook cannot read its input or cannot find a file, it writes one line with the time and the reason to .claude/hooks/state/hook_errors.log. The Start note hook reports that line count.\n- When blocking, use exit code 2, and write one line in the error output in the owner language: \"what was blocked + do this instead\".\n- Register hooks in .claude/settings.json in the form that does not go through a shell (program + argument list). On Windows without git, PowerShell reads the hook commands, and then `$CLAUDE_PROJECT_DIR` becomes empty and the hook silently does not run. With this form, the same path goes in on any PC.\n  | Hook program | \"command\" | \"args\" |\n  |---|---|---|\n  | Python (Windows, when py worked) | `\"py\"` | `[\"-3\", \"${CLAUDE_PROJECT_DIR}/.claude/hooks/<file>\"]` |\n  | Python (otherwise) | `\"python\"` or `\"python3\"` (whichever worked in Step 0) | `[\"${CLAUDE_PROJECT_DIR}/.claude/hooks/<file>\"]` |\n  | node | `\"node\"` | `[\"${CLAUDE_PROJECT_DIR}/.claude/hooks/<file>\"]` |\n  | PowerShell | `\"powershell.exe\"` | `[\"-NoProfile\", \"-ExecutionPolicy\", \"Bypass\", \"-File\", \"${CLAUDE_PROJECT_DIR}/.claude/hooks/<file>\"]` |\n  | perl | `\"perl\"` | `[\"${CLAUDE_PROJECT_DIR}/.claude/hooks/<file>\"]` |\n  The \"Bypass\" in the PowerShell row is a setting used only when running this hook. It does not change the PC's settings.\n- If Claude Code asks whether it may edit the settings file, tell the owner in one line: \"Please click Allow. This turns on the automatic check devices.\"\n\n| # | Name (file) | When it runs | What it does | Failure prevented |\n|---|---|---|---|---|\n| 1 | Start note (start_note) | SessionStart (conversation start · resume · clear · compact) | ① Write the current time to .claude/hooks/state/session_start.txt. ② Print \"[Memory system] current time · every line under Next and Blocked in 00_now.md · number of blocked lines whose check date is more than 7 days old · number of accidents in the accident ledger with no prevention device · hook_errors.log line count\" (the output goes into the conversation). Do not write your own code for the no-device count; count it only with the \"Start note accident ledger count\" code below. ③ If the last \"checkup\" line in the journal is more than 7 days old, print one more line: \"Time for a Data Management Dept checkup\". If 00_now.md cannot be found, print that it was \"not found\". | Not knowing yesterday's work when a conversation breaks · stale waiting lines · forgetting checkups |\n| 2 | Clock (clock) | UserPromptSubmit (every time the owner speaks) | Print one line `[Current time] YYYY-MM-DD HH:MM (weekday)`. | Guessing the time and being hours off |\n| 3 | Delete guard (guard_delete) | PreToolUse, for Bash and PowerShell | Block a command if it contains a permanent delete or an irreversible form. Blocked forms: `rm -r`·`rm -R`·`rm -rf`·`rm -fr` · `rmdir /s`·`rd /s` · `del /s` · `Remove-Item` (or `rm`·`ri`·`del`) with `-Recurse`·`-r` · `git reset --hard` · `git clean -f` · `git push --force`·`-f` · `git checkout .`. Notice: \"Move things to delete into memory/_trash/. If it is truly needed, ask the owner first, and the owner runs it.\" | Permanent deletion · reverts that wipe out other people's changes too |\n| 4 | Ledger guard (guard_ledger) | PreToolUse, for Write | Block any attempt to rewrite an existing memory/journal.md · memory/decisions.md · memory/accident-ledger.md as a whole. Notice: \"This is an append-only ledger. Use Edit to add at the bottom.\" | Overwriting a ledger and losing old records |\n| 5 | Rule length (rule_length) | PostToolUse, for Write and Edit | If the edited file is named CLAUDE.md (in any subfolder of this folder), count its lines. Over 80 lines, notify with exit code 2, because a CLAUDE.md in a subfolder also gets loaded into conversations. Notice: \"The longer the rules, the less they are followed. Merge them per Data Management Dept \"Adding a new rule\" step 3.\" | Rules bloat and get followed less |\n| 6 | Log check (log_check) | Stop (when about to end a reply) | stop_hook_active in the input is only a flag meaning \"this is another attempt to end after this device blocked it\". Even if it is true, do not skip the check; do ①②③ below the same way. Prevent infinite loops with a count: write the \"consecutive block count\" to .claude/hooks/state/log_check_count.txt. If stop_hook_active is not true, start from 0; add 1 each time it blocks; reset it to 0 when it passes without blocking. If it has already blocked 5 times in a row and must block again, let it pass this time, and write one line to hook_errors.log: \"log_check blocked 5 times in a row, released: remaining reason\" (the Start note reports that line count). In A) Program test, also run it once with a fake input where stop_hook_active is true and check that it blocks. Also run it once in a state where journal.md was edited and 00_now.md was edited a few seconds later, and check that ① does not block it (exit code 0; with git, after making a save point). The check works like this: base time = the later of the time in session_start.txt (6 hours ago if missing) and .claude/hooks/state/log_check_pass.txt (the last time this device passed without blocking). Every time it passes without blocking, write the current time to log_check_pass.txt (not when releasing after 5 blocks in a row). Find memory folder files changed after the base time (excluding journal.md, _trash, _savepoints). ① If there are such files and journal.md was not edited even once after the base time, block: \"You changed memory but did not write a line in the journal. Write it in the journal, then finish.\" The order of edits does not matter. Writing the journal first and editing 00_now.md and others later, as in the Data Management Dept closing, still passes. ② If decisions.md changed and its last entry has no \"Implementation status:\" line, block: \"Write the implementation status in the decision.\" ③ If git exists and `git status --porcelain -- CLAUDE.md .gitignore memory .claude` prints even one line, block: \"You changed the records but did not make a save point. Make a save point per Data Management Dept section 7, then finish.\" Without git, skip ③. | Changing things without leaving a log · writing only the decision without its implementation status · changing the records and ending without a save point |\n\n## Start note accident ledger count: do not write it yourself; insert the code below character for character\nEach AI that installed this wrote the count differently, and it was often wrong (treating an accident title \"##\" as the end of the section, so it was always 0 · counting the explanation inside the template, so it was 1). So here is finished code together with 6 examples whose answers are fixed.\n- Where it goes: if the hook program is Python, put the Python version; if PowerShell, the PowerShell version; at the top of the start_note file (right below the first-line comment), because it must run before reading the input and writing session_start.txt. Do not change a single character. Do not translate it even if the owner language is not English (keep the Korean in the code as well). For node or perl, port the Python version line by line with the same meaning, and port the 6 examples as they are.\n- How to use it: the count in row 1 ② = the number returned when the whole text of memory/accident-ledger.md, read as UTF-8, is passed to count_no_device (PowerShell = Count-NoDevice).\n- What this code counts (just read this · the code already does it): first remove `<!--` ~ `-->` comments → look only under the last undated \"## \" heading that comes before the first \"## \" heading containing a date (YYYY-MM-DD) (= \"Accidents in this folder\") → count only lines that start with `- Prevention device:` (Korean `- 막는 장치:`) and whose value is `None` (Korean `없음`). It does not look at heading text, so translating the headings gives the same result.\n- The gate: right after creating start_note, run it with exactly the program and arguments written in .claude/settings.json plus `--selftest` at the end. It then runs only the 6 examples (0 accidents · 1 · several · template explanation only · quote only · English headings) and exits (it does not write session_start.txt). Move on to the next hook only if the last line is `selftest 6/6 OK` and the exit code is 0.\n- If it fails: look at the example name in the FAIL line, compare the code you inserted with the code in this text line by line, fix the places copied differently (a missing line · a changed character · PowerShell BOM), and run it again. This is a copying error during install, so do not record it in the accident ledger. If it is identical to this text and still does not give 6/6, do not change the code; write \"count example test n/6 · names of failed examples\" in the Start note cell of the table in item 3 of the final report.\n\nPython version:\n```python\n# ---- accident ledger count (copied from the install text as is · do not edit) ----\nimport re, sys\n\ndef count_no_device(text):\n    text = re.sub(r\"<!--.*?(?:-->|\\Z)\", \"\", text, flags=re.S)\n    lines = re.split(r\"\\r?\\n\", text)\n    start, dated = 0, False\n    for i, ln in enumerate(lines):\n        if ln.startswith(\"## \"):\n            if re.search(r\"\\d{4}-\\d{2}-\\d{2}\", ln):\n                dated = True\n            elif not dated:\n                start = i + 1\n    n = 0\n    for ln in lines[start:]:\n        m = re.match(r\"^\\s*-\\s*(?:막는\\s*장치|prevent(?:ion|ive)\\s+device)\\s*:\\s*(.*?)\\s*$\", ln, re.I)\n        if m and m.group(1).lower() in (\"없음\", \"none\"):\n            n += 1\n    return n\n\ndef _inc(d, dev, en=False):\n    if en:\n        return \"## %s test accident\\n- What happened: test\\n- Root: test\\n- Rule: 10\\n- Prevention device: %s\\n- Who caught it first: AI\\n\\n\" % (d, dev)\n    return \"## %s trial accident\\n- What happened: trial\\n- Root cause: trial\\n- How to prevent: rule 10\\n- Prevention device: %s\\n- Who caught it first: AI\\n\\n\" % (d, dev)\n\ndef selftest():\n    head = (\"# Accident ledger: mistakes become rules and devices here. Append only\\n<!-- format\\n## YYYY-MM-DD one-line title\\n\"\n            \"- Prevention device: None / hook name / check name\\n-->\\n\\n## Inherited accidents (no dates · excluded from the score)\\n\"\n            \"- Worked with the rules file not loaded → rule 0 · device: Start note hook\\n\")\n    own = \"\\n## Accidents in this folder (dated from here on)\\n\"\n    en = (\"# Accident ledger\\n<!-- format\\n## YYYY-MM-DD one-line title\\n- Prevention device: None / hook name / check name\\n-->\\n\\n\"\n          \"## Inherited accidents (no dates)\\n- Rules were not loaded → rule 0 · device: start_note\\n\\n## Accidents in this folder (dated from here)\\n\")\n    cases = [\n        (\"zero\", 0, head + own),\n        (\"one\", 1, head + own + _inc(\"2026-11-01\", \"None\")),\n        (\"many\", 2, (head + own + _inc(\"2026-11-01\", \"guard_delete\") + _inc(\"2026-11-02\", \"None\")\n                     + _inc(\"2026-11-03\", \"None\") + _inc(\"2026-11-04\", \"start_note\")).replace(\"\\n\", \"\\r\\n\")),\n        (\"comment-only\", 0, head + own + \"<!-- memo\\n- Prevention device: None\\n-->\\n<!-- - Prevention device: None -->\\n\" + _inc(\"2026-11-01\", \"guard_ledger\")),\n        (\"quote-only\", 0, head + \"- Prevention device: None\\n\" + own\n                     + \"## 2026-11-01 quote accident\\n- What happened: miscounted the '- Prevention device: None' line\\n- Prevention device: log_check\\n\"),\n        (\"english\", 2, en + _inc(\"2026-11-01\", \"None\", True) + _inc(\"2026-11-02\", \"guard_delete\", True) + _inc(\"2026-11-03\", \"none\", True)),\n    ]\n    ok = 0\n    for name, want, text in cases:\n        got = count_no_device(text)\n        ok += (got == want)\n        print(\"%s %s expected %d got %d\" % (\"ok  \" if got == want else \"FAIL\", name, want, got))\n    print(\"selftest %d/%d %s\" % (ok, len(cases), \"OK\" if ok == len(cases) else \"FAIL\"))\n    return 0 if ok == len(cases) else 1\n\nif \"--selftest\" in sys.argv[1:]:\n    sys.exit(selftest())\n# ---- end of accident ledger count ----\n```\n\nPowerShell version (Windows PowerShell 5.1 · file saved as UTF-8 with BOM):\n```powershell\n# ---- accident ledger count (copied from the install text as is · do not edit) ----\nfunction Count-NoDevice([string]$text) {\n  $text = [regex]::Replace($text, '(?s)<!--.*?(?:-->|\\z)', '')\n  $lines = [regex]::Split($text, '\\r?\\n')\n  $start = 0; $dated = $false\n  for ($i = 0; $i -lt $lines.Count; $i++) {\n    if ($lines[$i].StartsWith('## ', [StringComparison]::Ordinal)) {\n      if ($lines[$i] -match '\\d{4}-\\d{2}-\\d{2}') { $dated = $true }\n      elseif (-not $dated) { $start = $i + 1 }\n    }\n  }\n  $n = 0\n  for ($i = $start; $i -lt $lines.Count; $i++) {\n    $m = [regex]::Match($lines[$i], '^\\s*-\\s*(?:막는\\s*장치|prevent(?:ion|ive)\\s+device)\\s*:\\s*(.*?)\\s*$', 'IgnoreCase')\n    if ($m.Success) {\n      $v = $m.Groups[1].Value.ToLower()\n      if ($v -eq '없음' -or $v -eq 'none') { $n++ }\n    }\n  }\n  return $n\n}\nfunction New-TestInc([string]$d, [string]$dev, [bool]$en) {\n  if ($en) { return \"## $d test accident`n- What happened: test`n- Root: test`n- Rule: 10`n- Prevention device: $dev`n- Who caught it first: AI`n`n\" }\n  return   const books = mine.map(p => { const nm = L(p, "name"), w = Math.max(50 + (nm.length % 4) * 5, LANG === "ko" ? spineCols(nm).length * 20 + 6 : 0), ht = 186 + ((p.num * 37) % 30);
    return `<a class="spine" href="#${p.num}" style="width:${w}px;height:${ht}px;background:${h.color}" title="#${p.num} ${esc(nm)}"><span class="ti">${LANG === "ko" ? spineCols(nm).map(esc).join("<br>") : esc(nm)}</span><span class="no">#${p.num}</span></a>`; }).join("");
  return `<div class="shelf"><div class="shelfh"><span class="rn">${h.rn}</span><h3>${esc(L(h, "name"))}</h3><p>${esc(L(h, "intro"))}</p></div><div class="books">${books}<span class="ghost" style="height:170px" aria-hidden="true"><span>${t.soon}</span></span><span class="ghost" style="height:150px;opacity:.6" aria-hidden="true"></span></div><div class="board"></div></div>`;
}

const guide = () => `<section class="sec" id="guide"><div class="sech"><div><div class="eyebrow">How to use</div><h2>${t.gH}</h2></div><p>${t.gP}</p></div>
  <div class="guide">${t.g.map(([h, p], i) => `<div><b>${i + 1}</b><h4>${h}</h4><p>${p}</p></div>`).join("")}</div></section>`;

function opening(){
  // 연 책이 아직 0권 — 영상이 열리는 날 첫 책이 꽂힌다(스포 막기)
  app.innerHTML = `<section class="hero"><div class="wrap"><div class="arch"></div>
    <div class="eyebrow" style="position:relative">The Prompt Library</div>
    <h1>${t.h1}</h1>
    <p class="lead">${t.oLead}</p>
    <div class="orn">✦</div>
    <div class="opening"><div class="eyebrow">Opening soon</div><h2>${t.oH}</h2>
      <p>${t.oP}</p>
      <div class="ghostrow" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div></div>
  </div></section><div class="wrap">${guide()}</div>`;
}

function home(q = "", hub = ""){
  if (!DATA.prompts.length) return opening();
  const ql = q.trim().replace(/^#/, "").toLowerCase();
  const h = hub && hubOf[hub];
  // 찾기는 두 언어 글을 다 본다(영어 화면에서 한국어 낱말로 찾아도 나오게)
  const hay = p => (p.name + p.one + (p.en ? p.en.name + p.en.one : "")).toLowerCase();
  const list = DATA.prompts.filter(p => (!h || p.hubs.includes(hub)) && (!ql || String(p.num) === ql || hay(p).includes(ql)));
  const results = `<div class="cat">${list.map(icard).join("") || `<div class="empty">${t.none}</div>`}</div>`;
  app.innerHTML = `<section class="hero"><div class="wrap"><div class="arch"></div>
    <div class="eyebrow" style="position:relative">The Prompt Library</div>
    <h1>${t.h1}</h1>
    <p class="lead">${t.lead}</p>
    <div class="orn">✦</div>
    <div class="seek"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" inputmode="search" autocomplete="off" placeholder="${t.ph}" value="${esc(q)}" aria-label="${t.search}"></div>
    <div class="stats"><div><b>${DATA.prompts.length}</b><span>${t.st[0]}</span></div><div><b>${HUBS.length}</b><span>${t.st[1]}</span></div><div><b>${t.st[2]}</b><span>${t.st[3]}</span></div></div>
  </div></section>
  <div class="wrap">
  ${ql || h ? `<section class="sec" style="padding-top:20px"><div class="sech"><div><div class="eyebrow">${h ? "Shelf " + h.rn : "Search"}</div><h2>${h ? t.shelf + " " + h.rn + " · " + esc(L(h, "name")) : t.found(esc(q.trim()), list.length)}</h2></div><p>${h ? esc(L(h, "intro")) : `<a href="#" style="color:var(--gold)">${t.all}</a>`}</p></div>${results}</section>`
  : `<section class="sec"><div class="sech"><div><div class="eyebrow">Floor plan</div><h2>${t.planH}</h2></div><p>${t.planP}</p></div>
      <div class="plan"><div class="map">${map()}</div><ol class="legend">${HUBS.map(x => `<li><a href="${shelfLink(x)}"><span class="rn">${x.rn}</span><span class="t">${esc(L(x, "name"))}</span><span class="c">${t.books(DATA.prompts.filter(p => p.hubs.includes(x.id)).length)}</span><span class="i">${esc(L(x, "intro"))}</span></a></li>`).join("")}</ol></div></section>
    <section class="sec"><div class="sech"><div><div class="eyebrow">The stacks</div><h2>${t.stH}</h2></div><p>${t.stP}</p></div>${HUBS.map(shelf).join("")}</section>
    <section class="sec"><div class="sech"><div><div class="eyebrow">Catalogue</div><h2>${t.catH}</h2></div><p>${t.catP}</p></div>${results}</section>
    ${guide()}`}
  </div>`;
  const qi = document.getElementById("q");
  qi.addEventListener("input", () => { const v = qi.value; home(v, hub); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(v.length, v.length); });
  qi.addEventListener("keydown", ev => { const v = qi.value.trim().replace(/^#/, ""); if (ev.key === "Enter" && byNum[v]) location.hash = v; });
}

function page(p){
  const h = hubOf[p.hubs[0]], nums = DATA.prompts.map(x => x.num).sort((a, b) => a - b), i = nums.indexOf(p.num);
  const prev = byNum[nums[i - 1]], next = byNum[nums[i + 1]];
  const rel = (title, list) => list.length ? `<div class="slip"><h4>${title}</h4>${list.map(n => `<a class="rel" href="#${n}"><span class="call">#${n} · ${call(n)}</span><span class="t">${esc(L(byNum[n], "name"))}</span></a>`).join("")}</div>` : "";
  const hn = id => esc(L(hubOf[id], "name")), text = L(p, "prompt");
  app.innerHTML = `<div class="wrap"><div class="crumb"><a href="#">${t.lib2}</a> › <a href="${shelfLink(h)}">${t.shelf} ${h.rn} ${hn(h.id)}</a> › #${p.num}</div>
  <article class="book"><div>
    <div class="titlepage"><div class="call2">${t.callNo} ${call(p.num)}</div><div class="bnum">#${p.num}</div><h1>${esc(L(p, "name"))}</h1>
      <p class="epi">${bold(L(p, "one"))}</p>
      <div class="tags">${p.hubs.map(id => `<a class="tag" href="${shelfLink(hubOf[id])}">${t.shelf} ${hubOf[id].rn} · ${hn(id)}</a>`).join("")}</div></div>
    ${L(p, "why") ? `<div class="note"><span class="lb">${t.librarian}</span><p>${esc(L(p, "why"))}</p></div>` : ""}
    <p class="how">${esc(L(p, "where"))}</p>
    <div class="ms"><div class="msbar"><span>PROMPT · ${call(p.num)}</span><button class="copy" id="cp"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>${t.copy}</span></button></div><pre>${esc(text)}</pre></div>
    <nav class="nextprev">${prev ? `<a href="#${prev.num}">${t.prev}<b>#${prev.num} ${esc(L(prev, "name"))}</b></a>` : "<span></span>"}${next ? `<a href="#${next.num}" style="text-align:right">${t.next}<b>#${next.num} ${esc(L(next, "name"))}</b></a>` : ""}</nav>
  </div>
  <aside class="side">
    <div class="slip"><h4>${t.info}</h4><dl><dt>${t.num}</dt><dd>#${p.num}</dd><dt>${t.callNo}</dt><dd>${call(p.num)}</dd><dt>${t.shelf}</dt><dd>${p.hubs.map(id => hubOf[id].rn + " " + hn(id)).join(" · ")}</dd></dl>
      ${p.video ? `<a class="watch" href="${esc(p.video)}" target="_blank" rel="noopener">${t.watch}</a>` : `<span class="watch off">${t.noVid}</span>`}</div>
    ${rel(t.before, p.before)}${rel(t.after, p.after)}
  </aside></article></div>`;
  const b = document.getElementById("cp"), label = b.querySelector("span");
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    label.textContent = t.copied; b.classList.add("done");
    setTimeout(() => { label.textContent = t.copy; b.classList.remove("done"); }, 1800);
  };
  document.title = `#${p.num} ${L(p, "name")} · ${LIB}`;
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  document.title = LIB;
  if (h === "guide") { if (!document.getElementById("guide")) home(); document.getElementById("guide").scrollIntoView(); return; }
  window.scrollTo(0, 0);
  if (byNum[h]) return page(byNum[h]);
  const m = h.match(/^\/shelf\/(.+)$/);
  if (m && hubOf[m[1]]) return home("", m[1]);
  home();
}
chrome(); addEventListener("hashchange", route); route();
</script>
</body>
</html>
